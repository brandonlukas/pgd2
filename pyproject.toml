[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[project]
name = "pgd2"
version = "0.1.0"
description = "Pseudotime Graph Diffusion (PGD) utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brandon Lukas" }]
keywords = ["single-cell", "pseudotime", "diffusion", "scRNA-seq"]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
]

[project.optional-dependencies]
scverse = [
  "anndata>=0.9",
]
torch = [
  "torch>=2.0",
]
viz = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "umap-learn>=0.5",
]
dev = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://example.invalid/pgd2"

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/pgd2"]
